<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
:root {
    --ink: #f4efe2;
    --muted: #a8a293;
    --brass: #d6b25e;
    --brass-dark: #8a6a24;
    --panel: rgba(17, 20, 28, 0.96);
    --line: rgba(255, 255, 255, 0.08);
    --red: #ff6b6b;
    --green: #4be08a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { overflow: hidden; font-family: "Segoe UI", Roboto, sans-serif; background: transparent !important; }

/* ---------------------------------------------------------- panel */
#panel {
    position: fixed;
    top: 68%;
    right: 24px;
    width: 300px;
    transform: translateY(-50%) translateX(18px);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 14px 40px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.05);
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
}
#panel.visible { opacity: 1; transform: translateY(-50%) translateX(0); }

.p-top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px;
    background: linear-gradient(90deg, rgba(214,178,94,0.16), rgba(214,178,94,0.03));
    border-bottom: 1px solid rgba(214,178,94,0.22);
    color: var(--brass);
    font-size: 10.5px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase;
}
.p-top .floor { color: var(--muted); letter-spacing: 1px; }

.p-body { display: flex; align-items: center; gap: 14px; padding: 14px; }

.tile {
    position: relative;
    width: 56px; height: 56px; flex-shrink: 0;
    border-radius: 14px;
    background: linear-gradient(145deg, #262b38, #171a22);
    border: 1px solid rgba(255,255,255,0.09);
    box-shadow: inset 0 2px 6px rgba(255,255,255,0.05), 0 4px 10px rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center;
}
.tile svg { width: 32px; height: 32px; }

/* door knob with key turn */
.knob {
    position: relative; width: 38px; height: 38px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #f0dc9c, #a98632 55%, #5d4b1d);
    box-shadow: inset 0 -3px 6px rgba(0,0,0,0.45), inset 0 2px 5px rgba(255,255,255,0.35);
}
.knob::before {
    content: ''; position: absolute; top: 50%; left: 50%;
    width: 7px; height: 7px; transform: translate(-50%, -70%);
    background: #14110a; border-radius: 50%;
}
.knob::after {
    content: ''; position: absolute; top: 50%; left: 50%;
    width: 3px; height: 8px; transform: translate(-50%, 0);
    background: #14110a; border-radius: 0 0 2px 2px;
}
.knob .key {
    position: absolute; top: 50%; left: 50%; width: 4px; height: 16px; z-index: 2;
    background: linear-gradient(#f4e9bd, #c2ab5e); border-radius: 2px;
    transform-origin: top center; transform: translate(-50%, -2px) rotate(0deg); opacity: 0;
}
.knob.turning .key { animation: turnkey .55s ease forwards; }
@keyframes turnkey {
    0%   { opacity: 0; transform: translate(-50%, -2px) rotate(0deg); }
    25%  { opacity: 1; }
    100% { opacity: 1; transform: translate(-50%, -2px) rotate(95deg); }
}

.info { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.title { color: var(--ink); font-size: 17px; font-weight: 700; letter-spacing: .3px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.pill {
    font-size: 10.5px; font-weight: 800; letter-spacing: 1.3px;
    padding: 3px 9px; border-radius: 999px;
    transition: background .3s, color .3s, box-shadow .3s;
}
.pill.locked   { background: rgba(224,60,60,0.16); color: var(--red);   box-shadow: 0 0 12px rgba(224,60,60,0.22); }
.pill.unlocked { background: rgba(60,220,120,0.14); color: var(--green); box-shadow: 0 0 12px rgba(60,220,120,0.22); }
.pill.gold     { background: rgba(214,178,94,0.14); color: var(--brass); }

.hint { display: flex; align-items: center; gap: 7px; color: #cfc9b8; font-size: 12.5px; }
.keycap {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 22px; height: 22px; padding: 0 5px;
    background: linear-gradient(#3a3f4c, #232631);
    border: 1px solid rgba(255,255,255,0.16); border-bottom-width: 3px; border-radius: 5px;
    color: #f0ead6; font-size: 12px; font-weight: 800;
}

.status {
    height: 0; overflow: hidden;
    padding: 0 14px;
    font-size: 11.5px; font-weight: 700; letter-spacing: .3px;
    transition: height .2s ease, padding .2s ease;
}
.status.show { height: 30px; padding: 7px 14px; border-top: 1px solid var(--line); }
.status.locked { color: var(--red); }
.status.unlocked { color: var(--green); }

#card {
    position: fixed;
    top: 50%; right: 28px;
    width: 350px;
    transform: translateY(-50%) translateX(40px) rotate(5deg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .35s ease, transform .5s cubic-bezier(.2,.9,.3,1.2);
}
#card.visible { opacity: 1; transform: translateY(-50%) translateX(0) rotate(-1.5deg); }

/* the plastic card: beach photo, "welcome", insert arrow */
.kc {
    position: relative; z-index: 2;
    width: 340px; height: 214px;
    border-radius: 14px;
    overflow: hidden;
    background: #efe2d2;
    box-shadow: 0 18px 40px rgba(0,0,0,0.55), 0 2px 0 rgba(255,255,255,0.6) inset;
}
.kc .beach { position: absolute; inset: 0; width: 100%; height: 100%; }
.kc::after {   /* plastic gloss */
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(115deg, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0) 38%, rgba(255,255,255,0) 70%, rgba(255,255,255,0.12) 100%);
    pointer-events: none;
}
.kc-welcome {
    position: absolute; left: 22px; bottom: 10px;
    font-family: 'KeyScript', 'Brush Script MT', cursive;
    font-size: 66px; line-height: 1;
    color: #151515;
    letter-spacing: .5px;
}
.kc-arrow {
    position: absolute; right: 30px; top: 92px;
    width: 0; height: 0;
    border-top: 9px solid transparent; border-bottom: 9px solid transparent;
    border-left: 13px solid #111;
}

/* the paper sleeve the front desk hands you with it */
.slip {
    position: relative; z-index: 1;
    margin: -26px 10px 0 18px;
    padding: 38px 18px 14px;
    background: #fbf9f4;
    border-radius: 4px 4px 10px 10px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    color: #2a2622;
    transform: rotate(1.8deg);
}
.slip::before {   /* folded edge */
    content: ''; position: absolute; left: 0; right: 0; top: 0; height: 26px;
    background: linear-gradient(#e7e2d8, #fbf9f4);
    border-radius: 4px 4px 0 0;
}
.slip-top { display: flex; justify-content: space-between; align-items: baseline;
    font-size: 10px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #8a7a62; }
.slip-row { display: flex; gap: 26px; margin-top: 8px; align-items: flex-end; }
.slip-label { font-size: 9px; letter-spacing: 1.8px; text-transform: uppercase; color: #9a907f; }
.slip-val { font-family: 'KeyScript', 'Brush Script MT', cursive; font-size: 34px; line-height: 1.05; color: #1d3c8f; }
.slip-guest { font-family: 'KeyScript', 'Brush Script MT', cursive; font-size: 24px; color: #1d3c8f; line-height: 1.1; }
.slip-note {
    margin-top: 10px; padding-top: 8px;
    border-top: 1px dashed #d8d0c2;
    font-size: 12.5px; font-weight: 600; color: #3b352d;
    display: flex; align-items: center; gap: 8px;
}
.slip-note svg { width: 18px; height: 18px; flex-shrink: 0; }
.slip-badge {
    margin-left: auto; font-size: 9px; font-weight: 800; letter-spacing: 1.3px;
    padding: 3px 8px; border-radius: 999px;
    color: #a2762a; border: 1px solid #d9bd85; background: #fbf1dc;
}
</style>
</head>
<body>

<div id="panel">
    <div class="p-top"><span id="pBuilding">Pier Motel</span><span class="floor" id="pFloor"></span></div>
    <div class="p-body">
        <div class="tile" id="tile"></div>
        <div class="info">
            <div class="title" id="pTitle">Room 1</div>
            <div class="row">
                <span class="pill locked" id="pill">LOCKED</span>
                <span class="hint" id="hint"><span class="keycap">K</span> Lock / Unlock</span>
            </div>
        </div>
    </div>
    <div class="status" id="status"></div>
</div>

<div id="card">
    <div class="kc">
        <svg class="beach" viewBox="0 0 340 214" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="sand" x1="0" y1="1" x2="1" y2="0">
                    <stop offset="0" stop-color="#e2ab8a"/><stop offset=".45" stop-color="#ecd2bb"/><stop offset="1" stop-color="#f6ece0"/>
                </linearGradient>
                <filter id="grain" x="0" y="0" width="100%" height="100%">
                    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/>
                    <feColorMatrix values="0 0 0 0 .45  0 0 0 0 .33  0 0 0 0 .25  0 0 0 .22 0"/>
                    <feComposite in2="SourceGraphic" operator="in"/>
                </filter>
                <filter id="foamTex" x="-5%" y="-5%" width="110%" height="110%">
                    <feTurbulence type="fractalNoise" baseFrequency=".035 .06" numOctaves="5" seed="11" result="n"/>
                    <feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G" result="shape"/>
                    <feTurbulence type="turbulence" baseFrequency=".03 .07" numOctaves="5" seed="5" result="t"/>
                    <feColorMatrix in="t" values="0 0 0 0 .62  0 0 0 0 .66  0 0 0 0 .72  -2.4 0 0 0 .78" result="shade"/>
                    <feFlood flood-color="#fbfbfa" result="white"/>

        <div class="slip-top"><span id="kcName">Pier Motel</span><span class="slip-badge" id="kcBadge">CHECKED IN</span></div>

<script>
const $ = (id) => document.getElementById(id);
const panel = $('panel'), tile = $('tile'), pill = $('pill'), hint = $('hint'), status = $('status');
let statusTimer = null, cardTimer = null;

const ICONS = {
    locker: '<svg viewBox="0 0 32 32" fill="none" stroke="#d6b25e" stroke-width="1.8"><rect x="4" y="5" width="24" height="21" rx="2.5"/><circle cx="16" cy="15.5" r="5"/><path d="M16 10.5v2M16 18.5v2M11 15.5h2M19 15.5h2"/><path d="M8 26v2M24 26v2"/></svg>',
    wardrobe: '<svg viewBox="0 0 32 32" fill="none" stroke="#d6b25e" stroke-width="1.8" stroke-linejoin="round"><path d="M16 9a2.5 2.5 0 1 1 2.5-2.5"/><path d="M16 9v2L4 20a1.5 1.5 0 0 0 1 2.7h22A1.5 1.5 0 0 0 28 20L16 11"/></svg>',
    reception: '<svg viewBox="0 0 32 32" fill="none" stroke="#d6b25e" stroke-width="1.8" stroke-linecap="round"><path d="M6 22a10 10 0 0 1 20 0"/><path d="M4 25h24"/><path d="M16 12V9M13.5 9h5"/></svg>'
};

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function setLocked(locked) {
    pill.textContent = locked ? 'LOCKED' : 'UNLOCKED';
    pill.className = 'pill ' + (locked ? 'locked' : 'unlocked');
}

function show(d) {
    $('pBuilding').textContent = d.label || '';
    $('pFloor').textContent = d.floor ? 'Floor ' + d.floor : '';
    pill.style.display = '';

    if (d.kind === 'door') {
        tile.innerHTML = '<div class="knob" id="knob"><div class="key"></div></div>';
        $('pTitle').textContent = 'Room ' + d.room;
        setLocked(d.locked);
        hint.innerHTML = '<span class="keycap">K</span> Lock / Unlock';
    } else if (d.kind === 'locker') {
        tile.innerHTML = ICONS.locker;
        $('pTitle').textContent = 'Room ' + d.room + ' Safe';
        pill.className = 'pill gold'; pill.textContent = 'YOURS';
        hint.innerHTML = '<span class="keycap">E</span> Open Safe';
    } else if (d.kind === 'wardrobe') {
        tile.innerHTML = ICONS.wardrobe;
        $('pTitle').textContent = 'Wardrobe';
        pill.style.display = 'none';
        hint.innerHTML = '<span class="keycap">E</span> Change Outfit';
    } else if (d.kind === 'reception') {
        tile.innerHTML = ICONS.reception;
        $('pTitle').textContent = 'Front Desk';
        $('pFloor').textContent = d.room ? 'Your room: ' + d.room : '';
        pill.style.display = 'none';
        hint.innerHTML = '<span class="keycap">E</span> ' + (d.room ? 'Get my key card' : 'Check in');
    }
    panel.classList.add('visible');
}

function showCard(c) {
    $('kcName').textContent = c.building || 'Motel';
    $('kcRoom').textContent = c.room;
    $('kcFloor').textContent = c.floor;
    $('kcGuest').textContent = c.guest || 'Guest';

    let badge = 'YOUR ROOM';
    if (c.fresh && c.same) badge = 'WELCOME BACK';
    else if (c.fresh) badge = 'CHECKED IN';
    $('kcBadge').textContent = badge;
    $('note').innerHTML = 'Take the elevator to <b>Floor ' + esc(c.floor) + '</b>';

    const card = $('card');
    card.classList.remove('visible');
    void card.offsetWidth;
    card.classList.add('visible');
    clearTimeout(cardTimer);
    cardTimer = setTimeout(() => card.classList.remove('visible'), 9000);
}

window.addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.action === 'show') {
        show(d);
    } else if (d.action === 'hide') {
        panel.classList.remove('visible');
    } else if (d.action === 'state') {
        setLocked(d.locked);
        status.textContent = d.locked ? 'Door locked' : 'Door unlocked';
        status.className = 'status show ' + (d.locked ? 'locked' : 'unlocked');
        clearTimeout(statusTimer);
        statusTimer = setTimeout(() => status.classList.remove('show'), 2200);
    } else if (d.action === 'turnkey') {
        const knob = $('knob');
        if (!knob) return;
        knob.classList.remove('turning');
        void knob.offsetWidth;
        knob.classList.add('turning');
    } else if (d.action === 'keycard') {
        showCard(d.card || {});
    }
});
</script>
