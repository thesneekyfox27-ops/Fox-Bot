<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
:root {
    --ink: #f4efe2;
    --muted: #a8a293;
    --brass: #d6b25e;
    --brass-dark: #8a6a24;
    --panel: rgba(17, 20, 28, 0.96);
    --line: rgba(255, 255, 255, 0.08);
    --red: #ff6b6b;
    --green: #4be08a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { overflow: hidden; font-family: "Segoe UI", Roboto, sans-serif; background: transparent !important; }

/* ---------------------------------------------------------- panel */
#panel {
    position: fixed;
    top: 68%;
    right: 24px;
    width: 300px;
    transform: translateY(-50%) translateX(18px);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 14px 40px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.05);
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
}
#panel.visible { opacity: 1; transform: translateY(-50%) translateX(0); }

.p-top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px;
    background: linear-gradient(90deg, rgba(214,178,94,0.16), rgba(214,178,94,0.03));
    border-bottom: 1px solid rgba(214,178,94,0.22);
    color: var(--brass);
    font-size: 10.5px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase;
}
.p-top .floor { color: var(--muted); letter-spacing: 1px; }

.p-body { display: flex; align-items: center; gap: 14px; padding: 14px; }

.tile {
    position: relative;
    width: 56px; height: 56px; flex-shrink: 0;
    border-radius: 14px;
    background: linear-gradient(145deg, #262b38, #171a22);
    border: 1px solid rgba(255,255,255,0.09);
    box-shadow: inset 0 2px 6px rgba(255,255,255,0.05), 0 4px 10px rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center;
}
.tile svg { width: 32px; height: 32px; }

/* door knob with key turn */
.knob {
    position: relative; width: 38px; height: 38px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #f0dc9c, #a98632 55%, #5d4b1d);
    box-shadow: inset 0 -3px 6px rgba(0,0,0,0.45), inset 0 2px 5px rgba(255,255,255,0.35);
}
.knob::before {
    content: ''; position: absolute; top: 50%; left: 50%;
    width: 7px; height: 7px; transform: translate(-50%, -70%);
    background: #14110a; border-radius: 50%;
}
.knob::after {
    content: ''; position: absolute; top: 50%; left: 50%;
    width: 3px; height: 8px; transform: translate(-50%, 0);
    background: #14110a; border-radius: 0 0 2px 2px;
}
.knob .key {
    position: absolute; top: 50%; left: 50%; width: 4px; height: 16px; z-index: 2;
    background: linear-gradient(#f4e9bd, #c2ab5e); border-radius: 2px;
    transform-origin: top center; transform: translate(-50%, -2px) rotate(0deg); opacity: 0;
}
.knob.turning .key { animation: turnkey .55s ease forwards; }
@keyframes turnkey {
    0%   { opacity: 0; transform: translate(-50%, -2px) rotate(0deg); }
    25%  { opacity: 1; }
    100% { opacity: 1; transform: translate(-50%, -2px) rotate(95deg); }
}

.info { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.title { color: var(--ink); font-size: 17px; font-weight: 700; letter-spacing: .3px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.pill {
    font-size: 10.5px; font-weight: 800; letter-spacing: 1.3px;
    padding: 3px 9px; border-radius: 999px;
    transition: background .3s, color .3s, box-shadow .3s;
}
.pill.locked   { background: rgba(224,60,60,0.16); color: var(--red);   box-shadow: 0 0 12px rgba(224,60,60,0.22); }
.pill.unlocked { background: rgba(60,220,120,0.14); color: var(--green); box-shadow: 0 0 12px rgba(60,220,120,0.22); }
.pill.gold     { background: rgba(214,178,94,0.14); color: var(--brass); }

.hint { display: flex; align-items: center; gap: 7px; color: #cfc9b8; font-size: 12.5px; }
.keycap {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 22px; height: 22px; padding: 0 5px;
    background: linear-gradient(#3a3f4c, #232631);
    border: 1px solid rgba(255,255,255,0.16); border-bottom-width: 3px; border-radius: 5px;
    color: #f0ead6; font-size: 12px; font-weight: 800;
}

.status {
    height: 0; overflow: hidden;
    padding: 0 14px;
    font-size: 11.5px; font-weight: 700; letter-spacing: .3px;
    transition: height .2s ease, padding .2s ease;
}
.status.show { height: 30px; padding: 7px 14px; border-top: 1px solid var(--line); }
.status.locked { color: var(--red); }
.status.unlocked { color: var(--green); }

/* -------------------------------------------------------- key card */
#card {
    position: fixed;
    top: 50%; right: 24px;
    transform: translateY(-50%) translateX(40px) rotate(4deg);
    width: 340px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .35s ease, transform .45s cubic-bezier(.2,.9,.3,1.2);
}
#card.visible { opacity: 1; transform: translateY(-50%) translateX(0) rotate(-2deg); }

.sleeve-note {
    color: var(--ink);
    font-size: 13px; font-weight: 600;
    text-align: right;
    margin-bottom: 10px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.8);
}
.sleeve-note b { color: var(--brass); }

.kc {
    position: relative;
    height: 212px;
    border-radius: 16px;
    padding: 18px 20px;
    color: #fbf6e8;
    background:
        radial-gradient(120% 90% at 100% 0%, rgba(214,178,94,0.30), transparent 55%),
        repeating-linear-gradient(135deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 7px),
        linear-gradient(150deg, #1b2a45 0%, #0f1a2e 55%, #0a1220 100%);
    border: 1px solid rgba(214,178,94,0.45);
    box-shadow: 0 22px 50px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.12);
    overflow: hidden;
}
.kc::after {   /* glossy sweep */
    content: ''; position: absolute; top: -60%; left: -40%;
    width: 60%; height: 220%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.10), transparent);
    transform: rotate(20deg);
    animation: sweep 2.6s ease .4s 1 both;
}
@keyframes sweep { from { left: -60%; } to { left: 130%; } }

.kc-head { display: flex; align-items: center; justify-content: space-between; }
.kc-brand { display: flex; align-items: center; gap: 9px; }
.kc-crest {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1.5px solid var(--brass);
    display: flex; align-items: center; justify-content: center;
    color: var(--brass); font-family: Georgia, serif; font-size: 14px; font-weight: 700;
}
.kc-name { font-family: Georgia, "Times New Roman", serif; font-size: 17px; letter-spacing: .6px; }
.kc-sub { font-size: 9px; letter-spacing: 2.4px; color: var(--brass); text-transform: uppercase; margin-top: 1px; }
.kc-chip {
    width: 38px; height: 28px; border-radius: 6px;
    background: linear-gradient(135deg, #f3dc95, #b8923d 60%, #8e6c25);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.25);
    position: relative;
}
.kc-chip::before, .kc-chip::after {
    content: ''; position: absolute; background: rgba(0,0,0,0.25);
}
.kc-chip::before { left: 12px; right: 12px; top: 0; bottom: 0; border-left: 1px solid rgba(0,0,0,0.3); border-right: 1px solid rgba(0,0,0,0.3); background: none; }
.kc-chip::after  { top: 13px; left: 0; right: 0; height: 1px; }

.kc-mid { display: flex; align-items: flex-end; gap: 22px; margin-top: 16px; }
.kc-label { font-size: 9px; letter-spacing: 2px; color: #9fb0cc; text-transform: uppercase; }
.kc-room { font-family: Georgia, serif; font-size: 56px; font-weight: 700; line-height: 1; color: #fff; }
.kc-floor { font-family: Georgia, serif; font-size: 28px; font-weight: 700; line-height: 1; color: var(--brass); }

.kc-foot {
    position: absolute; left: 20px; right: 20px; bottom: 16px;
    display: flex; align-items: flex-end; justify-content: space-between;
}
.kc-guest { font-size: 13px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; }
.kc-badge {
    font-size: 9.5px; font-weight: 800; letter-spacing: 1.4px;
    padding: 4px 9px; border-radius: 999px;
    background: rgba(214,178,94,0.18); color: var(--brass);
    border: 1px solid rgba(214,178,94,0.4);
}
.kc-stripe {
    position: absolute; right: 0; top: 0; bottom: 0; width: 14px;
    background: linear-gradient(90deg, #050608, #1a1d24);
    opacity: .85;
}
</style>
</head>
<body>

<div id="panel">
    <div class="p-top"><span id="pBuilding">Pier Motel</span><span class="floor" id="pFloor"></span></div>
    <div class="p-body">
        <div class="tile" id="tile"></div>
        <div class="info">
            <div class="title" id="pTitle">Room 1</div>
            <div class="row">
                <span class="pill locked" id="pill">LOCKED</span>
                <span class="hint" id="hint"><span class="keycap">K</span> Lock / Unlock</span>
            </div>
        </div>
    </div>
    <div class="status" id="status"></div>
</div>

<div id="card">
    <div class="sleeve-note" id="note"></div>
    <div class="kc">
        <div class="kc-stripe"></div>
        <div class="kc-head">
            <div class="kc-brand">
                <div class="kc-crest" id="kcCrest">P</div>
                <div>
                    <div class="kc-name" id="kcName">Pier Motel</div>
                    <div class="kc-sub">Guest Key Card</div>
                </div>
            </div>
            <div class="kc-chip"></div>
        </div>
        <div class="kc-mid">
            <div><div class="kc-label">Room</div><div class="kc-room" id="kcRoom">12</div></div>
            <div><div class="kc-label">Floor</div><div class="kc-floor" id="kcFloor">2</div></div>
        </div>
        <div class="kc-foot">
            <div>
                <div class="kc-label">Guest</div>
                <div class="kc-guest" id="kcGuest">John Doe</div>
            </div>
            <div class="kc-badge" id="kcBadge">CHECKED IN</div>
        </div>
    </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const panel = $('panel'), tile = $('tile'), pill = $('pill'), hint = $('hint'), status = $('status');
let statusTimer = null, cardTimer = null;

const ICONS = {
    locker: '<svg viewBox="0 0 32 32" fill="none" stroke="#d6b25e" stroke-width="1.8"><rect x="4" y="5" width="24" height="21" rx="2.5"/><circle cx="16" cy="15.5" r="5"/><path d="M16 10.5v2M16 18.5v2M11 15.5h2M19 15.5h2"/><path d="M8 26v2M24 26v2"/></svg>',
    wardrobe: '<svg viewBox="0 0 32 32" fill="none" stroke="#d6b25e" stroke-width="1.8" stroke-linejoin="round"><path d="M16 9a2.5 2.5 0 1 1 2.5-2.5"/><path d="M16 9v2L4 20a1.5 1.5 0 0 0 1 2.7h22A1.5 1.5 0 0 0 28 20L16 11"/></svg>',
    reception: '<svg viewBox="0 0 32 32" fill="none" stroke="#d6b25e" stroke-width="1.8" stroke-linecap="round"><path d="M6 22a10 10 0 0 1 20 0"/><path d="M4 25h24"/><path d="M16 12V9M13.5 9h5"/></svg>'
};

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function setLocked(locked) {
    pill.textContent = locked ? 'LOCKED' : 'UNLOCKED';
    pill.className = 'pill ' + (locked ? 'locked' : 'unlocked');
}

function show(d) {
    $('pBuilding').textContent = d.label || '';
    $('pFloor').textContent = d.floor ? 'Floor ' + d.floor : '';
    pill.style.display = '';

    if (d.kind === 'door') {
        tile.innerHTML = '<div class="knob" id="knob"><div class="key"></div></div>';
        $('pTitle').textContent = 'Room ' + d.room;
        setLocked(d.locked);
        hint.innerHTML = '<span class="keycap">K</span> Lock / Unlock';
    } else if (d.kind === 'locker') {
        tile.innerHTML = ICONS.locker;
        $('pTitle').textContent = 'Room ' + d.room + ' Safe';
        pill.className = 'pill gold'; pill.textContent = 'YOURS';
        hint.innerHTML = '<span class="keycap">E</span> Open Safe';
    } else if (d.kind === 'wardrobe') {
        tile.innerHTML = ICONS.wardrobe;
        $('pTitle').textContent = 'Wardrobe';
        pill.style.display = 'none';
        hint.innerHTML = '<span class="keycap">E</span> Change Outfit';
    } else if (d.kind === 'reception') {
        tile.innerHTML = ICONS.reception;
        $('pTitle').textContent = 'Front Desk';
        $('pFloor').textContent = d.room ? 'Your room: ' + d.room : '';
        pill.style.display = 'none';
        hint.innerHTML = '<span class="keycap">E</span> ' + (d.room ? 'Get my key card' : 'Check in');
    }
    panel.classList.add('visible');
}

function showCard(c) {
    $('kcName').textContent = c.building || 'Motel';
    $('kcCrest').textContent = (c.building || 'M').trim().charAt(0).toUpperCase();
    $('kcRoom').textContent = c.room;
    $('kcFloor').textContent = c.floor;
    $('kcGuest').textContent = c.guest || 'Guest';

    let badge = 'YOUR ROOM', note;
    if (c.fresh && c.same) { badge = 'WELCOME BACK'; note = 'Welcome back! Same room as last time, <b>Room ' + esc(c.room) + '</b> on <b>Floor ' + esc(c.floor) + '</b>.'; }
    else if (c.fresh)      { badge = 'CHECKED IN';   note = 'You\'re in <b>Room ' + esc(c.room) + '</b>, take the stairs to <b>Floor ' + esc(c.floor) + '</b>.'; }
    else                   { note = 'You\'re in <b>Room ' + esc(c.room) + '</b> on <b>Floor ' + esc(c.floor) + '</b>.'; }
    $('kcBadge').textContent = badge;
    $('note').innerHTML = note;

    const card = $('card');
    card.classList.remove('visible');
    void card.offsetWidth;
    card.classList.add('visible');
    clearTimeout(cardTimer);
    cardTimer = setTimeout(() => card.classList.remove('visible'), 8000);
}

window.addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.action === 'show') {
        show(d);
    } else if (d.action === 'hide') {
        panel.classList.remove('visible');
    } else if (d.action === 'state') {
        setLocked(d.locked);
        status.textContent = d.locked ? 'Door locked' : 'Door unlocked';
        status.className = 'status show ' + (d.locked ? 'locked' : 'unlocked');
        clearTimeout(statusTimer);
        statusTimer = setTimeout(() => status.classList.remove('show'), 2200);
    } else if (d.action === 'turnkey') {
        const knob = $('knob');
        if (!knob) return;
        knob.classList.remove('turning');
        void knob.offsetWidth;
        knob.classList.add('turning');
    } else if (d.action === 'keycard') {
        showCard(d.card || {});
    }
});
</script>
</body>
</html>
