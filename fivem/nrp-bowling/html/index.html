:root {
    --navy: #0f1530;
    --navy2: #18204a;
    --ink: #f7f2e6;
    --muted: #a7a9c4;
    --pink: #ff4fa3;
    --teal: #2fe0d0;
    --gold: #ffc94a;
    --red: #ff5d6c;
    --paper: #fbf8ef;
    --paperline: #d9d2bf;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink); user-select: none; }
.hidden { display: none !important; }
.disp { font-family: 'Lanes', Impact, sans-serif; letter-spacing: 1px; }
.key {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 28px; height: 26px; padding: 0 7px; border-radius: 6px;
    background: linear-gradient(#ffffff, #d9dcef); color: #121733;
    font-weight: 900; font-size: 12px; box-shadow: 0 3px 0 #8a8fb5;
}

/* ---------------- right side: prompt + controls card ---------------- */
#side { position: fixed; right: 26px; top: 50%; transform: translateY(-50%); width: 290px; display: flex; flex-direction: column; gap: 10px; }
#prompt {
    display: flex; align-items: center; gap: 12px; padding: 11px 14px;
    background: rgba(15,21,48,.94); border: 1px solid rgba(255,255,255,.08); border-left: 4px solid var(--gold);
    border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.45);
    font-size: 14px; font-weight: 600;
}
#controls {
    background: rgba(15,21,48,.94); border: 1px solid rgba(255,255,255,.08); border-radius: 14px;
    box-shadow: 0 12px 34px rgba(0,0,0,.5); overflow: hidden;
}
.c-head { padding: 10px 14px; background: linear-gradient(90deg, var(--pink), #8a4dff); display: flex; justify-content: space-between; align-items: baseline; }
.c-head .t { font-size: 22px; line-height: 1; }
.c-head .s { font-size: 11px; font-weight: 700; letter-spacing: 1px; opacity: .9; }
.c-body { padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.c-row { display: flex; align-items: center; gap: 10px; }
.c-row .keys { display: flex; gap: 4px; min-width: 74px; }
.c-note { color: var(--muted); font-size: 12px; line-height: 1.35; }

/* ---------------- score sheet ---------------- */
#board { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); width: 630px; }
.b-top {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 14px; background: linear-gradient(90deg, var(--navy2), var(--navy));
    border: 1px solid rgba(255,255,255,.1); border-bottom: none; border-radius: 12px 12px 0 0;
}
.b-top .lane { font-size: 22px; color: var(--teal); text-shadow: 0 0 12px rgba(47,224,208,.5); }
.b-top .status { font-size: 12px; font-weight: 700; letter-spacing: 1px; color: var(--muted); }
.sheet { background: var(--paper); color: #1b1d2e; border-radius: 0 0 12px 12px; padding: 6px; box-shadow: 0 14px 34px rgba(0,0,0,.45); }
.row { display: grid; align-items: stretch; border-bottom: 1px solid var(--paperline); }
.row:last-child { border-bottom: none; }
.row.head { color: #6b6a7c; font-size: 10px; font-weight: 800; letter-spacing: 1px; text-align: center; }
.row.head .fno.now { color: var(--pink); }
.name { padding: 6px 8px; font-weight: 800; font-size: 12px; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
.row.turn { background: linear-gradient(90deg, rgba(255,79,163,.16), rgba(255,79,163,0)); }
.row.turn .name::before { content: '\25B6'; color: var(--pink); font-size: 10px; }
.frame { border-left: 1px solid var(--paperline); display: flex; flex-direction: column; min-height: 44px; }
.frame.now { background: rgba(255,201,74,.18); }
.marks { display: flex; justify-content: flex-end; height: 20px; }
.marks span { width: 16px; text-align: center; font-weight: 900; font-size: 13px; border-left: 1px solid var(--paperline); border-bottom: 1px solid var(--paperline); }
.marks span.x { color: var(--pink); }
.marks span.sp { color: #1a8f86; }
.ftot { flex: 1; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; }
.total { border-left: 2px solid #1b1d2e; display: flex; align-items: center; justify-content: center; font-family: 'Lanes', Impact, sans-serif; font-size: 24px; }

/* ---------------- banner ---------------- */
#banner { position: fixed; top: 52%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; }
#banner .big { font-size: 110px; line-height: .9; text-shadow: 0 0 30px rgba(255,79,163,.7), 0 6px 0 #4b1838; color: #fff; }
#banner .big.strike { color: var(--pink); }
#banner .big.spare { color: var(--teal); text-shadow: 0 0 30px rgba(47,224,208,.7), 0 6px 0 #0e4743; }
#banner .big.gutter { color: var(--red); text-shadow: 0 0 20px rgba(255,93,108,.5), 0 6px 0 #4a1219; font-size: 80px; }
#banner .big.pins { font-size: 80px; color: var(--gold); text-shadow: 0 0 20px rgba(255,201,74,.5), 0 6px 0 #5a4310; }
#banner .who { font-size: 18px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 2px 8px rgba(0,0,0,.8); }
#banner.go { animation: bang 2.6s ease forwards; }
@keyframes bang { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } 20% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }

/* ---------------- aim + power ---------------- */
#aimbox { position: fixed; left: 50%; bottom: 6%; transform: translateX(-50%); width: 440px; display: flex; flex-direction: column; gap: 10px; }
.gauge { background: rgba(15,21,48,.92); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 10px 14px; }
.g-row { display: grid; grid-template-columns: 74px 1fr 46px; align-items: center; gap: 10px; font-size: 11px; font-weight: 800; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; }
.g-row + .g-row { margin-top: 7px; }
.track { position: relative; height: 8px; border-radius: 99px; background: #262d58; }
.track .mid { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: rgba(255,255,255,.35); }
.track .dot { position: absolute; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 10px var(--teal); transition: left .08s linear; }
.track .dot.spin { background: var(--pink); box-shadow: 0 0 10px var(--pink); }
.g-row .v { color: var(--ink); text-align: right; }
#power { height: 26px; border-radius: 99px; background: #262d58; position: relative; overflow: hidden; border: 2px solid rgba(255,255,255,.15); }
#power .sweet { position: absolute; top: 0; bottom: 0; background: rgba(47,224,208,.35); border-left: 2px solid var(--teal); border-right: 2px solid var(--teal); }
#power .fill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #8a4dff, var(--pink), var(--gold)); }
#power .lbl { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 1px 3px rgba(0,0,0,.8); }

/* ---------------- front desk ---------------- */
#desk { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, rgba(15,21,48,.45), rgba(5,6,15,.8)); }
.d-shell { width: 860px; max-width: 94vw; background: var(--navy); border: 1px solid rgba(255,255,255,.1); border-radius: 18px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.7); animation: pop .22s ease; }
@keyframes pop { from { transform: scale(.97); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.d-hero { position: relative; padding: 18px 24px 16px; background: linear-gradient(110deg, #8a4dff, var(--pink) 60%, var(--gold)); }
.d-hero .t { font-size: 46px; line-height: .9; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.25); }
.d-hero .s { font-size: 12px; font-weight: 800; letter-spacing: 3px; color: rgba(255,255,255,.9); margin-top: 4px; }
.d-hero .pins { position: absolute; right: 70px; bottom: 6px; font-size: 54px; opacity: .25; }
.d-close { position: absolute; right: 16px; top: 14px; width: 34px; height: 34px; border-radius: 10px; border: none; background: rgba(15,21,48,.55); color: #fff; font-size: 16px; cursor: pointer; }
.d-body { padding: 16px 22px 20px; }
.d-opts { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 13px; color: var(--muted); }
.seg { display: inline-flex; background: #1c2350; border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: none; background: transparent; color: var(--muted); padding: 7px 14px; border-radius: 8px; font-weight: 800; font-size: 12px; cursor: pointer; letter-spacing: .5px; }
.seg button.on { background: var(--teal); color: #08201e; }
.lanes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.ln { background: #161d44; border: 1px solid rgba(255,255,255,.07); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-height: 132px; }
.ln .n { font-size: 30px; line-height: 1; }
.ln .st { font-size: 11px; font-weight: 800; letter-spacing: 1px; }
.ln.free .st { color: var(--teal); } .ln.lobby .st { color: var(--gold); } .ln.playing .st, .ln.done .st { color: var(--red); }
.ln .who { font-size: 12px; color: var(--muted); min-height: 30px; line-height: 1.3; }
.ln button {
    margin-top: auto; border: none; border-radius: 9px; padding: 8px; cursor: pointer;
    font-family: 'Lanes', Impact, sans-serif; font-size: 17px; letter-spacing: 1.5px;
    background: linear-gradient(var(--pink), #d12f80); color: #fff; box-shadow: 0 3px 0 #7e1b4d;
}
.ln button.join { background: linear-gradient(var(--gold), #e0a320); color: #2a1d00; box-shadow: 0 3px 0 #8a6510; }
.ln button[disabled] { background: #2a3160; color: #6e7299; box-shadow: none; cursor: default; }
.d-foot { margin-top: 14px; display: flex; gap: 18px; font-size: 12px; color: var(--muted); align-items: center; flex-wrap: wrap; }
.d-foot .key { min-width: 24px; height: 22px; font-size: 10px; margin-right: 5px; }
</style>
</head>
<body>

<div id="side">
    <div id="prompt" class="hidden"><span class="key" id="pKey">E</span><span id="pTxt"></span></div>
    <div id="controls" class="hidden">
        <div class="c-head"><span class="t disp" id="cTitle">LANE 1</span><span class="s" id="cSub"></span></div>
        <div class="c-body" id="cBody"></div>
    </div>
</div>

<div id="board" class="hidden">
    <div class="b-top"><span class="lane disp" id="bLane">LANE 1</span><span class="status" id="bStatus"></span></div>
    <div class="sheet" id="sheet"></div>
</div>

<div id="banner" class="hidden"><div class="big disp" id="bnBig">STRIKE!</div><div class="who" id="bnWho"></div></div>

<div id="aimbox" class="hidden">
    <div class="gauge">
        <div class="g-row"><span>Position</span><div class="track"><div class="mid"></div><div class="dot" id="gPos" style="left:50%"></div></div><span class="v" id="vPos">0</span></div>
        <div class="g-row"><span>Aim</span><div class="track"><div class="mid"></div><div class="dot" id="gAim" style="left:50%"></div></div><span class="v" id="vAim">0&deg;</span></div>
        <div class="g-row"><span>Spin</span><div class="track"><div class="mid"></div><div class="dot spin" id="gSpin" style="left:50%"></div></div><span class="v" id="vSpin">none</span></div>
    </div>
    <div id="power" class="hidden"><div class="sweet" id="pSweet"></div><div class="fill" id="pFill" style="width:0"></div><div class="lbl">RELEASE IN THE GREEN</div></div>
</div>

<div id="desk" class="hidden">
    <div class="d-shell">
        <div class="d-hero">
            <button class="d-close" id="dClose">&#10005;</button>
            <div class="t disp" id="dName">NEIGHBORHOOD LANES</div>
            <div class="s" id="dSub">RENT A LANE &middot; $15 PER PLAYER</div>
            <div class="pins">&#127923;</div>
        </div>
        <div class="d-body">
            <div class="d-opts">
                <span>Opening a lane? Pick the game length - friends join from this desk before you start.</span>
                <div class="seg" id="dLen"></div>
            </div>
            <div class="lanes" id="dLanes"></div>
            <div class="d-foot">
                <span><span class="key">G</span>owner starts the game at the lane</span>
                <span><span class="key">E</span>pick up your ball on your turn</span>
                <span><span class="key">DEL</span>leave your lane</span>
            </div>
        </div>
    </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const RES = (typeof GetParentResourceName === 'function') ? GetParentResourceName() : 'nrp-bowling';
const post = (n, d) => fetch(`https://${RES}/${n}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(d || {}) }).catch(() => {});
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const K = (k) => `<span class="key">${k}</span>`;

/* ---------- controls card ---------- */
const CONTROLS = {
    lobbyOwner: (x) => ({ t: `LANE ${x.lane}`, s: 'WAITING TO START', rows: [[K('G'), 'Start the game (at your lane)'], [K('DEL'), 'Leave lane']], note: `${x.players} bowler${x.players === 1 ? '' : 's'} signed in. Friends can still join at the front desk.` }),
    lobby:      (x) => ({ t: `LANE ${x.lane}`, s: 'WAITING TO START', rows: [[K('DEL'), 'Leave lane']], note: 'Waiting for the lane owner to start the game.' }),
    wait:       (x) => ({ t: `LANE ${x.lane}`, s: 'UP NOW', rows: [[K('DEL'), 'Leave lane']], note: `${esc(x.who)} is bowling.` }),
    pickup:     (x) => ({ t: `FRAME ${x.frame}`, s: `BALL ${x.roll} - ${x.standing} PINS UP`, rows: [[K('E'), 'Pick up your ball at the marker']], note: "It's your turn! Walk to the glowing marker on your lane." }),
    aim:        (x) => ({ t: `FRAME ${x.frame}`, s: `BALL ${x.roll} - ${x.standing} PINS UP`, rows: [
                    [K('A') + K('D'), 'Step left / right'],
                    [K('&larr;') + K('&rarr;'), 'Aim (or mouse)'],
                    [K('Q') + K('E'), 'Spin left / right'],
                    [K('SPACE'), 'Hold for power, release to bowl'],
                    [K('C'), 'Change camera'],
                    [K('BKSP'), 'Step off']],
                  note: 'Release when the power bar is in the green for a straight ball. Spin hooks the ball in the back half of the lane.' }),
    rolling:    (x) => ({ t: `FRAME ${x.frame}`, s: 'ROLLING...', rows: [], note: 'Watch it go!' }),
};

function controls(kind, extra) {
    const f = CONTROLS[kind];
    if (!f) { $('controls').classList.add('hidden'); return; }
    const c = f(extra || {});
    $('cTitle').textContent = c.t;
    $('cSub').textContent = c.s;
    $('cBody').innerHTML = c.rows.map(r => `<div class="c-row"><span class="keys">${r[0]}</span><span>${r[1]}</span></div>`).join('') +
        (c.note ? `<div class="c-note">${c.note}</div>` : '');
    $('controls').classList.remove('hidden');
}

/* ---------- score sheet ---------- */
let boardWanted = false, boardNear = false;
function boardShow() { $('board').classList.toggle('hidden', !(boardWanted && boardNear)); }

function renderBoard(v, me) {
    const n = v.frames;
    const cols = `118px repeat(${n - 1}, 1fr) 1.4fr 54px`;
    $('bLane').textContent = `LANE ${v.id}`;
    $('bStatus').textContent = v.status === 'lobby' ? `WAITING TO START - ${v.players.length}/${v.maxPlayers} BOWLERS`
        : v.status === 'done' ? 'GAME OVER' : `FRAME ${v.frame || 1} OF ${n}`;
    let html = `<div class="row head" style="grid-template-columns:${cols}"><div class="name">BOWLER</div>`;
    for (let f = 1; f <= n; f++) html += `<div class="fno ${v.frame === f && v.status === 'playing' ? 'now' : ''}">${f}</div>`;
    html += `<div>TOTAL</div></div>`;
    v.players.forEach(p => {
        const isTurn = v.status === 'playing' && p.src === v.turn;
        html += `<div class="row ${isTurn ? 'turn' : ''}" style="grid-template-columns:${cols}"><div class="name">${esc(p.name)}${p.src === me ? ' (you)' : ''}</div>`;
        for (let f = 1; f <= n; f++) {
            const fr = (p.frames && p.frames[f - 1]) || (p.frames && p.frames[f]) || {};
            const marks = Array.isArray(fr.marks) ? fr.marks : Object.values(fr.marks || {});
            const slots = f === n ? 3 : 2;
            let ms = '';
            for (let i = 0; i < slots; i++) {
                let m = marks[i] ?? '';
                if (f < n && marks[0] === 'X') m = i === 1 ? 'X' : '';
                ms += `<span class="${m === 'X' ? 'x' : m === '/' ? 'sp' : ''}">${esc(m)}</span>`;
            }
            const now = isTurn && v.frame === f;
            html += `<div class="frame ${now ? 'now' : ''}"><div class="marks">${ms}</div><div class="ftot">${fr.total ?? ''}</div></div>`;
        }
        html += `<div class="total">${p.total}</div></div>`;
    });
    $('sheet').innerHTML = html;
}

/* ---------- banner ---------- */
let bannerTimer = null;
function banner(name, text, final) {
    const b = $('banner'), big = $('bnBig');
    big.textContent = text;
    big.className = 'big disp ' + (final ? 'strike' : text === 'STRIKE!' ? 'strike' : text === 'SPARE!' ? 'spare' : text === 'GUTTER' ? 'gutter' : 'pins');
    if (final) big.style.fontSize = '64px'; else big.style.fontSize = '';
    $('bnWho').textContent = name || '';
    b.classList.remove('hidden', 'go'); void b.offsetWidth; b.classList.add('go');
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => b.classList.add('hidden'), final ? 6000 : 2700);
}

/* ---------- aim gauges ---------- */
function aim(d) {
    if (d.hide) { $('aimbox').classList.add('hidden'); return; }
    $('aimbox').classList.remove('hidden');
    const pct = (v) => (50 + v * 46) + '%';
    $('gPos').style.left = pct(d.offset); $('vPos').textContent = (d.offset > 0 ? 'R' : d.offset < 0 ? 'L' : '') + Math.round(Math.abs(d.offset) * 100);
    $('gAim').style.left = pct(d.aim);    $('vAim').innerHTML = (d.aim * 5).toFixed(1) + '&deg;';
    $('gSpin').style.left = pct(d.spin);  $('vSpin').textContent = d.spin === 0 ? 'none' : (d.spin < 0 ? 'L ' : 'R ') + Math.round(Math.abs(d.spin) * 100) + '%';
}
function power(d) {
    const p = $('power');
    if (d.sweet) { $('pSweet').style.left = (d.sweet[0] * 100) + '%'; $('pSweet').style.width = ((d.sweet[1] - d.sweet[0]) * 100) + '%'; }
    $('pFill').style.width = (Math.max(0, Math.min(1, d.value || 0)) * 100) + '%';
    if (d.hide) setTimeout(() => p.classList.add('hidden'), 500); else p.classList.remove('hidden');
}

/* ---------- desk ---------- */
let D = null, len = 10;
function renderDesk() {
    $('dName').textContent = (D.name || 'Bowling').toUpperCase();
    $('dSub').innerHTML = `RENT A LANE &middot; $${D.price} PER PLAYER &middot; UP TO ${D.max} BOWLERS`;
    const lens = Array.isArray(D.lengths) ? D.lengths : Object.values(D.lengths || {});
    if (!lens.includes(len)) len = lens[0];
    $('dLen').innerHTML = lens.map(l => `<button class="${l === len ? 'on' : ''}" data-l="${l}">${l === 10 ? 'FULL GAME (10)' : 'QUICK (' + l + ')'}</button>`).join('');
    $('dLen').querySelectorAll('button').forEach(b => b.onclick = () => { len = +b.dataset.l; renderDesk(); });
    const lanes = Array.isArray(D.lanes) ? D.lanes : Object.values(D.lanes || {});
    $('dLanes').innerHTML = '';
    lanes.forEach(l => {
        const el = document.createElement('div');
        const names = Array.isArray(l.players) ? l.players : Object.values(l.players || {});
        el.className = 'ln ' + l.status;
        let st = 'OPEN', who = 'Free lane', btn = `<button>OPEN LANE</button>`;
        if (l.status === 'lobby') { st = `SIGN-UPS ${names.length}/${D.max}`; who = names.map(esc).join(', '); btn = names.length < D.max && !D.myLane ? `<button class="join">JOIN</button>` : `<button disabled>${names.length >= D.max ? 'FULL' : 'JOIN'}</button>`; }
        if (l.status === 'playing' || l.status === 'done') { st = 'IN USE'; who = names.map(esc).join(', '); btn = `<button disabled>IN USE</button>`; }
        if (l.status === 'free' && D.myLane) btn = `<button disabled>OPEN LANE</button>`;
        el.innerHTML = `<div class="n disp">LANE ${l.id}</div><div class="st">${st}</div><div class="who">${who}</div>${btn}`;
        const b = el.querySelector('button:not([disabled])');
        if (b) b.onclick = () => { $('desk').classList.add('hidden'); post(l.status === 'free' ? 'open' : 'join', { lane: l.id, frames: len }); };
        $('dLanes').appendChild(el);
    });
    $('desk').classList.remove('hidden');
}
function closeDesk() { $('desk').classList.add('hidden'); post('close'); }
$('dClose').onclick = closeDesk;
window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('desk').classList.contains('hidden')) closeDesk(); });

/* ---------- messages ---------- */
window.addEventListener('message', (e) => {
    const d = e.data || {};
    switch (d.action) {
        case 'prompt':
            if (d.text) { $('pKey').textContent = d.key || 'E'; $('pTxt').textContent = d.text; $('prompt').classList.remove('hidden'); }
            else $('prompt').classList.add('hidden');
            break;
        case 'controls': controls(d.kind, d.extra); break;
        case 'board':
            if (d.hide) { boardWanted = false; boardShow(); break; }
            boardWanted = true; renderBoard(d.view, d.me); boardShow(); break;
        case 'boardVisible': boardNear = !!d.show; boardShow(); break;
        case 'banner': banner(d.name, d.text, d.final); break;
        case 'aim': aim(d); break;
        case 'power': power(d); break;
        case 'desk': D = d.data; renderDesk(); break;
    }
});
</script>
</body>
</html>
